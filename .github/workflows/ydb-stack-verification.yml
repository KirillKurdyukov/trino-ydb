name: YDB stack verification

on:
  push:
    branches: [qa/ydb-stack-20261015]

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  CONTINUOUS_INTEGRATION: true
  MAVEN_OPTS: "-Xmx3G -XX:+ExitOnOutOfMemoryError"
  MAVEN_ARGS: "--global-settings ${{ github.workspace }}/.mvn/settings-ci.xml"
  TESTCONTAINERS_PULL_PAUSE_TIMEOUT: 600
  SOURCE_SHA: 873f52f045859cb1d89fc657f3836cf37758b9a0
  UPSTREAM_BASE_SHA: f8c6e46cea4d9d23ce4a0cbec0e3f58447df1ab6
  EXPECTED_INTEGRATION_TREE_SHA: 97177f9a253d1fa7a14e5ab4d622b5f9c03d28da
  VERIFY_WRITE: 'false'
  VERIFY_EXPRESSION: 'false'
  VERIFY_AGGREGATION: 'false'
  VERIFY_TOPN: 'false'
  VERIFY_JOIN: 'false'
  VERIFY_DML: 'false'
  VERIFY_MERGE: 'false'

jobs:
  connector:
    name: Connector checks JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        java: ['25.0.4', '27', '28-ea']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: Vladimir-Petrunko/trino
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Integrate pinned upstream base without changing published history
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags https://github.com/trinodb/trino.git "$UPSTREAM_BASE_SHA"
          git -c user.name='YDB verification' -c user.email='qa@localhost' merge --no-commit --no-ff "$UPSTREAM_BASE_SHA"
          integration_tree=$(git write-tree)
          test "$integration_tree" = "$EXPECTED_INTEGRATION_TREE_SHA"
          printf 'INTEGRATION_TREE_SHA=%s\n' "$integration_tree" >> "$GITHUB_ENV"
          printf 'SOURCE_SHA=%s\nUPSTREAM_BASE_SHA=%s\nINTEGRATION_TREE_SHA=%s\n' "$SOURCE_SHA" "$UPSTREAM_BASE_SHA" "$integration_tree" > integration-tree.txt
      - uses: ./.github/actions/setup
        with:
          java-version: ${{ matrix.java }}
          cache: 'true'
          cleanup-node: 'true'
      - name: Reserve YDB helper ports from ephemeral client allocation
        if: matrix.java == '25.0.4'
        run: |
          # SDK 2.4.10 explicitly binds this range; clients must not claim it between container starts.
          # https://github.com/ydb-platform/ydb-java-sdk/blob/v2.4.10/tests/common/src/main/java/tech/ydb/test/integration/utils/PortsGenerator.java
          reserved=$(sysctl -n net.ipv4.ip_local_reserved_ports)
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${reserved:+$reserved,}51000-59000"
          sysctl net.ipv4.ip_local_port_range net.ipv4.ip_local_reserved_ports
      - name: Build reactor with all Maven checks
        run: ./mvnw -B -ntp -pl plugin/trino-ydb -am -DskipTests install
      - name: Strict dependency exclusion check
        run: ./mvnw -B -ntp -pl plugin/trino-ydb -Dmdep.exclusion.fail=true org.apache.maven.plugins:maven-dependency-plugin:3.11.0:analyze-exclusions
      - name: Error Prone
        if: matrix.java == '25.0.4'
        run: ./mvnw -B -ntp -pl plugin/trino-ydb -Perrorprone-compiler -DskipTests clean test-compile
      - name: Direct read-only native execution boundary
        if: matrix.java == '25.0.4' && env.VERIFY_WRITE == 'false'
        run: |
          ./mvnw -B -ntp -pl plugin/trino-ydb -Dtest='TestYdbPlugin,TestYdbConnectorSmokeTest#testNativeExecuteIsUnsupported' test
          mkdir -p plugin/trino-ydb/target/direct-readonly-reports
          cp plugin/trino-ydb/target/surefire-reports/*TestYdbPlugin* plugin/trino-ydb/target/surefire-reports/*TestYdbConnectorSmokeTest* plugin/trino-ydb/target/direct-readonly-reports/
      - name: Direct CREATE, INSERT and DDL regressions
        if: matrix.java == '25.0.4' && env.VERIFY_WRITE == 'true'
        run: |
          ./mvnw -B -ntp -pl plugin/trino-ydb -Dtest='TestYdbCreateTable,TestYdbWriteMetadata,TestYdbConnectorSmokeTest#testInsert+testCreateTable+testCreateTableAsSelect+testShowCreateTable+testRenameTable*,TestYdbConnectorTest#testInsert*+testAdd*+testAlterTableAddLongColumnName+testDropColumn+testDropAndAddColumnWithSameName+testDropRowField*+testDropNotNullConstraint*+testRenameTable*+testCreateTable+testCreateTableAsSelect+testShowCreateTable+testNativeTypeReads+testUnsupportedMutationsRejected' test
          cp -R plugin/trino-ydb/target/surefire-reports plugin/trino-ydb/target/direct-write-reports
      - name: Direct expression and predicate regressions
        if: matrix.java == '25.0.4' && env.VERIFY_EXPRESSION == 'true'
        run: |
          ./mvnw -B -ntp -pl plugin/trino-ydb -Dtest='TestYdbExpressionRewrites,TestYdbExpressionPushdown' test
          mkdir -p plugin/trino-ydb/target/direct-expression-reports
          cp plugin/trino-ydb/target/surefire-reports/*TestYdbExpression* plugin/trino-ydb/target/direct-expression-reports/
      - name: Direct aggregation regressions and inherited contracts
        if: matrix.java == '25.0.4' && env.VERIFY_AGGREGATION == 'true'
        run: |
          ./mvnw -B -ntp -pl plugin/trino-ydb -Dtest='TestYdbAggregationRewrites,TestYdbAggregationPushdown,TestYdbConnectorTest#testAggregation+testLimitPushdown+testTopNPushdown,TestYdbConnectorSmokeTest#testAggregation' test
          mkdir -p plugin/trino-ydb/target/direct-aggregation-reports
          cp plugin/trino-ydb/target/surefire-reports/*TestYdbAggregation* plugin/trino-ydb/target/direct-aggregation-reports/
          cp plugin/trino-ydb/target/surefire-reports/*TestYdbConnectorTest* plugin/trino-ydb/target/surefire-reports/*TestYdbConnectorSmokeTest* plugin/trino-ydb/target/direct-aggregation-reports/
      - name: Direct TopN ordering regressions
        if: matrix.java == '25.0.4' && env.VERIFY_TOPN == 'true'
        run: |
          ./mvnw -B -ntp -pl plugin/trino-ydb -Dtest='TestYdbTopN,TestYdbTopNPushdown' test
          mkdir -p plugin/trino-ydb/target/direct-topn-reports
          cp plugin/trino-ydb/target/surefire-reports/*TestYdbTopN* plugin/trino-ydb/target/direct-topn-reports/
      - name: Direct JOIN key, default and inherited regressions
        if: matrix.java == '25.0.4' && env.VERIFY_JOIN == 'true'
        run: |
          ./mvnw -B -ntp -pl plugin/trino-ydb -Dtest='TestYdbJoinMappings,TestYdbJoinPushdown,TestYdbConnectorTest#testJoin+testJoinWithEmptySides,TestYdbConnectorSmokeTest#testJoin' test
          mkdir -p plugin/trino-ydb/target/direct-join-reports
          cp plugin/trino-ydb/target/surefire-reports/*TestYdbJoin* plugin/trino-ydb/target/direct-join-reports/
          cp plugin/trino-ydb/target/surefire-reports/*TestYdbConnectorTest* plugin/trino-ydb/target/surefire-reports/*TestYdbConnectorSmokeTest* plugin/trino-ydb/target/direct-join-reports/
      - name: Direct pushed UPDATE and DELETE counts
        if: matrix.java == '25.0.4' && env.VERIFY_DML == 'true'
        run: |
          ./mvnw -B -ntp -pl plugin/trino-ydb -Dtest=TestYdbDmlPushdown test
          mkdir -p plugin/trino-ydb/target/direct-dml-reports
          cp plugin/trino-ydb/target/surefire-reports/*TestYdbDml* plugin/trino-ydb/target/direct-dml-reports/
      - name: Direct complete MERGE and row-level mutation contracts
        if: matrix.java == '25.0.4' && env.VERIFY_MERGE == 'true'
        run: |
          ./mvnw -B -ntp -pl plugin/trino-ydb -Dtest='TestYdbMerge,TestYdbMergeSink,TestYdbConnectorTest#testMerge*+testUpdate*+testRowLevelUpdate+testDelete*+testExplainAnalyzeWithDelete*,TestYdbConnectorSmokeTest#testMerge+testUpdate+testDelete' test
          mkdir -p plugin/trino-ydb/target/direct-merge-reports
          cp plugin/trino-ydb/target/surefire-reports/*TestYdbMerge* plugin/trino-ydb/target/direct-merge-reports/
          cp plugin/trino-ydb/target/surefire-reports/*TestYdbConnectorTest* plugin/trino-ydb/target/surefire-reports/*TestYdbConnectorSmokeTest* plugin/trino-ydb/target/direct-merge-reports/
      - name: Complete YDB connector suite
        if: matrix.java == '25.0.4'
        run: ./mvnw -B -ntp -pl plugin/trino-ydb verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: connector-reports-${{ matrix.java }}
          path: |
            plugin/trino-ydb/target/surefire-reports/
            plugin/trino-ydb/target/direct-write-reports/
            plugin/trino-ydb/target/direct-expression-reports/
            plugin/trino-ydb/target/direct-aggregation-reports/
            plugin/trino-ydb/target/direct-topn-reports/
            plugin/trino-ydb/target/direct-join-reports/
            plugin/trino-ydb/target/direct-dml-reports/
            plugin/trino-ydb/target/direct-merge-reports/
            core/trino-main/target/surefire-reports/
            integration-tree.txt

  product:
    name: Packaged server and SuiteYdb
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/qa/ydb-stack
          sparse-checkout-cone-mode: false
      - name: Preserve independent HTTP QA harness
        run: |
          cp .github/qa/ydb-stack/YdbReadOnlyHttpProof.java "$RUNNER_TEMP/YdbReadOnlyHttpProof.java"
          cp .github/qa/ydb-stack/YdbWriteHttpProof.java "$RUNNER_TEMP/YdbWriteHttpProof.java"
          cp .github/qa/ydb-stack/YdbExpressionHttpProof.java "$RUNNER_TEMP/YdbExpressionHttpProof.java"
          cp .github/qa/ydb-stack/YdbAggregationHttpProof.java "$RUNNER_TEMP/YdbAggregationHttpProof.java"
          cp .github/qa/ydb-stack/YdbTopNHttpProof.java "$RUNNER_TEMP/YdbTopNHttpProof.java"
          cp .github/qa/ydb-stack/YdbJoinHttpProof.java "$RUNNER_TEMP/YdbJoinHttpProof.java"
          cp .github/qa/ydb-stack/YdbDmlHttpProof.java "$RUNNER_TEMP/YdbDmlHttpProof.java"
          cp .github/qa/ydb-stack/YdbMergeHttpProof.java "$RUNNER_TEMP/YdbMergeHttpProof.java"
      - uses: actions/checkout@v7.0.1
        with:
          repository: Vladimir-Petrunko/trino
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Integrate pinned upstream base without changing published history
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags https://github.com/trinodb/trino.git "$UPSTREAM_BASE_SHA"
          git -c user.name='YDB verification' -c user.email='qa@localhost' merge --no-commit --no-ff "$UPSTREAM_BASE_SHA"
          integration_tree=$(git write-tree)
          test "$integration_tree" = "$EXPECTED_INTEGRATION_TREE_SHA"
          printf 'INTEGRATION_TREE_SHA=%s\n' "$integration_tree" >> "$GITHUB_ENV"
          printf 'SOURCE_SHA=%s\nUPSTREAM_BASE_SHA=%s\nINTEGRATION_TREE_SHA=%s\n' "$SOURCE_SHA" "$UPSTREAM_BASE_SHA" "$integration_tree" > integration-tree.txt
      - uses: ./.github/actions/setup
        with:
          cache: 'true'
          cleanup-node: 'true'
      - name: Build server and product distribution with Maven checks
        run: ./mvnw -B -ntp -T 2 -DskipTests -P product-test-distribution -pl '!:trino-docs' install
      - name: Verify YDB is shipped
        run: |
          archive=core/trino-server/target/trino-server-485-SNAPSHOT.tar.gz
          tar -tzf "$archive" | grep -E '/plugin/ydb/trino-ydb-485-SNAPSHOT\.jar$'
          tar -tzf "$archive" | grep -E '/plugin/ydb/trino-ydb-485-SNAPSHOT-services\.jar$'
      - name: Build image from this exact server archive
        run: core/docker/build.sh -a amd64 -t ydb-stack-create-insert -x
      - name: Record owned QA resource baseline
        run: |
          docker ps -aq > "$RUNNER_TEMP/ydb-container-baseline"
          docker network ls -q > "$RUNNER_TEMP/ydb-network-baseline"
          mkdir -p logs
      - name: Run packaged-server product smoke
        run: |
          distribution=testing/trino-product-tests/target/product-test-distribution
          test_jar=("$distribution"/lib/trino-product-tests-*-tests.jar)
          classpath=$(< "$distribution/classpath.txt")
          classpath="$distribution/${classpath//:/:$distribution/}"
          java -Xmx512M -XX:+ExitOnOutOfMemoryError \
            -Dtrino.product-tests.image=ydb-stack-create-insert:485-SNAPSHOT-amd64 \
            -cp "${test_jar[0]}:$classpath" \
            io.trino.tests.product.suite.SuiteYdb
      - name: Run independent read-only HTTP proof
        if: env.VERIFY_WRITE != 'true'
        run: |
          distribution=testing/trino-product-tests/target/product-test-distribution
          test_jar=("$distribution"/lib/trino-product-tests-*-tests.jar)
          classpath=$(< "$distribution/classpath.txt")
          classpath="$distribution/${classpath//:/:$distribution/}"
          java -Xmx512M -XX:+ExitOnOutOfMemoryError \
            -Dtrino.product-tests.image=ydb-stack-create-insert:485-SNAPSHOT-amd64 \
            -cp "${test_jar[0]}:$classpath" \
            "$RUNNER_TEMP/YdbReadOnlyHttpProof.java" "$GITHUB_WORKSPACE/logs/readonly-http.json"
      - name: Run independent HTTP and native-state proof
        if: env.VERIFY_WRITE == 'true'
        run: |
          distribution=testing/trino-product-tests/target/product-test-distribution
          test_jar=("$distribution"/lib/trino-product-tests-*-tests.jar)
          classpath=$(< "$distribution/classpath.txt")
          classpath="$distribution/${classpath//:/:$distribution/}"
          java -Xmx512M -XX:+ExitOnOutOfMemoryError \
            -Dtrino.product-tests.image=ydb-stack-create-insert:485-SNAPSHOT-amd64 \
            -cp "${test_jar[0]}:$classpath" \
            "$RUNNER_TEMP/YdbWriteHttpProof.java" "$GITHUB_WORKSPACE/logs/runtime-http.json"
      - name: Run independent expression HTTP and EXPLAIN proof
        if: env.VERIFY_EXPRESSION == 'true'
        run: |
          distribution=testing/trino-product-tests/target/product-test-distribution
          test_jar=("$distribution"/lib/trino-product-tests-*-tests.jar)
          classpath=$(< "$distribution/classpath.txt")
          classpath="$distribution/${classpath//:/:$distribution/}"
          java -Xmx512M -XX:+ExitOnOutOfMemoryError \
            -Dtrino.product-tests.image=ydb-stack-create-insert:485-SNAPSHOT-amd64 \
            -cp "${test_jar[0]}:$classpath" \
            "$RUNNER_TEMP/YdbExpressionHttpProof.java" "$GITHUB_WORKSPACE/logs/expression-http.json"
      - name: Run independent aggregation HTTP and EXPLAIN proof
        if: env.VERIFY_AGGREGATION == 'true'
        run: |
          distribution=testing/trino-product-tests/target/product-test-distribution
          test_jar=("$distribution"/lib/trino-product-tests-*-tests.jar)
          classpath=$(< "$distribution/classpath.txt")
          classpath="$distribution/${classpath//:/:$distribution/}"
          java -Xmx512M -XX:+ExitOnOutOfMemoryError \
            -Dtrino.product-tests.image=ydb-stack-create-insert:485-SNAPSHOT-amd64 \
            -cp "${test_jar[0]}:$classpath" \
            "$RUNNER_TEMP/YdbAggregationHttpProof.java" "$GITHUB_WORKSPACE/logs/aggregation-http.json"
      - name: Run independent TopN HTTP and EXPLAIN proof
        if: env.VERIFY_TOPN == 'true'
        run: |
          distribution=testing/trino-product-tests/target/product-test-distribution
          test_jar=("$distribution"/lib/trino-product-tests-*-tests.jar)
          classpath=$(< "$distribution/classpath.txt")
          classpath="$distribution/${classpath//:/:$distribution/}"
          java -Xmx512M -XX:+ExitOnOutOfMemoryError \
            -Dtrino.product-tests.image=ydb-stack-create-insert:485-SNAPSHOT-amd64 \
            -cp "${test_jar[0]}:$classpath" \
            "$RUNNER_TEMP/YdbTopNHttpProof.java" "$GITHUB_WORKSPACE/logs/topn-http.json"
      - name: Run independent JOIN HTTP and EXPLAIN proof
        if: env.VERIFY_JOIN == 'true'
        run: |
          distribution=testing/trino-product-tests/target/product-test-distribution
          test_jar=("$distribution"/lib/trino-product-tests-*-tests.jar)
          classpath=$(< "$distribution/classpath.txt")
          classpath="$distribution/${classpath//:/:$distribution/}"
          java -Xmx512M -XX:+ExitOnOutOfMemoryError \
            -Dtrino.product-tests.image=ydb-stack-create-insert:485-SNAPSHOT-amd64 \
            -cp "${test_jar[0]}:$classpath" \
            "$RUNNER_TEMP/YdbJoinHttpProof.java" "$GITHUB_WORKSPACE/logs/join-http.json"
      - name: Run independent pushed DML counts and native state proof
        if: env.VERIFY_DML == 'true'
        run: |
          distribution=testing/trino-product-tests/target/product-test-distribution
          test_jar=("$distribution"/lib/trino-product-tests-*-tests.jar)
          classpath=$(< "$distribution/classpath.txt")
          classpath="$distribution/${classpath//:/:$distribution/}"
          java -Xmx512M -XX:+ExitOnOutOfMemoryError \
            -Dtrino.product-tests.image=ydb-stack-create-insert:485-SNAPSHOT-amd64 \
            -cp "${test_jar[0]}:$classpath" \
            "$RUNNER_TEMP/YdbDmlHttpProof.java" "$GITHUB_WORKSPACE/logs/dml-http.json"
      - name: Run independent MERGE and native key-state proof
        if: env.VERIFY_MERGE == 'true'
        run: |
          distribution=testing/trino-product-tests/target/product-test-distribution
          test_jar=("$distribution"/lib/trino-product-tests-*-tests.jar)
          classpath=$(< "$distribution/classpath.txt")
          classpath="$distribution/${classpath//:/:$distribution/}"
          java -Xmx512M -XX:+ExitOnOutOfMemoryError \
            -Dtrino.product-tests.image=ydb-stack-create-insert:485-SNAPSHOT-amd64 \
            -cp "${test_jar[0]}:$classpath" \
            "$RUNNER_TEMP/YdbMergeHttpProof.java" "$GITHUB_WORKSPACE/logs/merge-http.json"
      - name: Verify cleanup of owned QA containers and networks
        if: always()
        run: |
          mkdir -p logs
          if [ ! -f "$RUNNER_TEMP/ydb-container-baseline" ] || [ ! -f "$RUNNER_TEMP/ydb-network-baseline" ]; then
            printf 'No QA container scenario started\n' > logs/cleanup.txt
            exit 0
          fi
          docker ps -aq > "$RUNNER_TEMP/ydb-container-after"
          while IFS= read -r id; do
            if [ -n "$id" ] && ! grep -Fxq "$id" "$RUNNER_TEMP/ydb-container-baseline"; then
              if ! docker rm -f "$id"; then
                remaining=$(docker ps -aq --filter "id=$id")
                test -z "$remaining"
              fi
            fi
          done < "$RUNNER_TEMP/ydb-container-after"
          docker network ls -q > "$RUNNER_TEMP/ydb-network-after"
          while IFS= read -r id; do
            if [ -n "$id" ] && ! grep -Fxq "$id" "$RUNNER_TEMP/ydb-network-baseline"; then
              if ! docker network rm "$id"; then
                remaining=$(docker network ls -q --filter "id=$id")
                test -z "$remaining"
              fi
            fi
          done < "$RUNNER_TEMP/ydb-network-after"
          docker ps -aq > "$RUNNER_TEMP/ydb-container-final"
          docker network ls -q > "$RUNNER_TEMP/ydb-network-final"
          comm -13 <(sort "$RUNNER_TEMP/ydb-container-baseline") <(sort "$RUNNER_TEMP/ydb-container-final") > "$RUNNER_TEMP/ydb-container-leftovers"
          comm -13 <(sort "$RUNNER_TEMP/ydb-network-baseline") <(sort "$RUNNER_TEMP/ydb-network-final") > "$RUNNER_TEMP/ydb-network-leftovers"
          test ! -s "$RUNNER_TEMP/ydb-container-leftovers"
          test ! -s "$RUNNER_TEMP/ydb-network-leftovers"
          printf 'PASS: no owned QA containers or networks remain\n' > logs/cleanup.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: product-reports
          path: |
            testing/trino-product-tests/target/surefire-reports/
            testing/trino-product-tests/target/reports/
            logs/
            integration-tree.txt

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: Vladimir-Petrunko/trino
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Integrate pinned upstream base without changing published history
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags https://github.com/trinodb/trino.git "$UPSTREAM_BASE_SHA"
          git -c user.name='YDB verification' -c user.email='qa@localhost' merge --no-commit --no-ff "$UPSTREAM_BASE_SHA"
          integration_tree=$(git write-tree)
          test "$integration_tree" = "$EXPECTED_INTEGRATION_TREE_SHA"
          printf 'INTEGRATION_TREE_SHA=%s\n' "$integration_tree" >> "$GITHUB_ENV"
          printf 'SOURCE_SHA=%s\nUPSTREAM_BASE_SHA=%s\nINTEGRATION_TREE_SHA=%s\n' "$SOURCE_SHA" "$UPSTREAM_BASE_SHA" "$integration_tree" > integration-tree.txt
      - name: Build actual Sphinx documentation
        run: docs/build
      - name: Verify connector page
        run: test -s docs/target/html/connector/ydb.html
